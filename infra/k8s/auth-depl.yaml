apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
spec:
  replicas: 1
  #how to find the pods it creates
  selector:
    matchLabels:
      app: auth
  #how to create pods
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: vinaayak/auth
          # Saving secrets in kubernates pods
          env:
            - name: DB_URL
              value: "mongodb://auth-mongo-srv:27017/auth"
            - name: HOST_IP
              value: "0.0.0.0"
            - name: HOST_PORT
              value: "3000"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  ports:
    - name: auth
      protocol: TCP
      port: 3000
      targetPort: 3000
